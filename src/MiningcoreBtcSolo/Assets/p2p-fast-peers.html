<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>P2P Fast Peers - Miningcore BTC Solo</title>
<style>
:root{--page:#f2f3f5;--ink:#202124;--muted:#656b73;--line:#d9dde2;--blue:#0067b8;--teal:#008272;--green:#107c10;--red:#c23934;--amber:#8a5b00;--white:#fff}
*{box-sizing:border-box}html{color-scheme:light;background:var(--page)}body{margin:0;min-width:300px;min-height:100vh;background:var(--page);color:var(--ink);font:14px/1.45 'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:2px;background:var(--white);color:var(--ink);cursor:pointer}button:hover{border-color:#8a9098;background:#f8f9fa}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #111;outline-offset:2px}button.primary{border-color:var(--blue);background:var(--blue);color:#fff}button.primary:hover{background:#005a9e}button.danger{color:var(--red)}button:disabled{cursor:wait;opacity:.55}
.page{width:min(1440px,100%);margin:0 auto;padding:26px 24px 40px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px;font-weight:650}.subtitle{margin-top:5px;color:var(--muted);font-size:13px}.head-actions,.toolbar,.form-row,.inline-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.summary{display:flex;gap:24px;padding:14px 0;border-bottom:1px solid var(--line);color:var(--muted)}.summary strong{color:var(--ink);font-variant-numeric:tabular-nums}.section{padding-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.section-head h2{margin:0;font-size:17px;font-weight:650}.toolbar label{color:var(--muted)}select,input{height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}.form-row{padding:14px 0;border-bottom:1px solid var(--line)}.form-row input{width:min(360px,100%)}.hint{color:var(--muted);font-size:12px}.message{min-height:21px;margin:9px 0 3px;color:var(--muted)}.message.error{color:var(--red)}.message.ok{color:var(--green)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);background:#fff}.peer-table{width:100%;border-collapse:collapse;min-width:920px}.peer-table th,.peer-table td{padding:11px 12px;border-bottom:1px solid #e8eaed;text-align:left;vertical-align:middle}.peer-table th{background:#f8f9fa;color:var(--muted);font-size:11px;font-weight:650;text-transform:uppercase;white-space:nowrap}.peer-table tr:last-child td{border-bottom:0}.peer-address{font-family:Consolas,'Cascadia Mono',monospace;font-weight:600;overflow-wrap:anywhere}.sub{display:block;margin-top:3px;color:var(--muted);font-size:12px}.state{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#8a9098}.state-connected .dot{background:var(--green)}.state-failed .dot,.state-disconnected .dot{background:var(--red)}.state-reconnecting .dot,.state-connecting .dot,.state-handshaking .dot{background:#c58a00}.pill{display:inline-block;padding:2px 6px;border:1px solid var(--line);color:var(--muted);font-size:11px}.num{font-variant-numeric:tabular-nums}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-peer{display:none}.sort-indicator{color:var(--blue)}
.auto-controls{display:flex;align-items:end;flex-wrap:wrap;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.auto-controls label{display:grid;gap:5px;color:var(--muted);font-size:12px}.auto-controls input[type=number]{width:120px}.auto-toggle{display:flex!important;align-items:center;gap:8px;min-height:38px;color:var(--ink)!important;font-size:14px!important}.auto-toggle input{width:18px;height:18px;margin:0;accent-color:var(--teal)}.auto-status{min-height:22px;padding-top:9px;color:var(--muted);font-size:12px}.blacklist-row{display:flex;align-items:flex-start;gap:14px;margin-top:2px}.blacklist-details{flex:1;min-width:0}.blacklist-details summary{cursor:pointer}.blacklist-peers{padding-top:6px;white-space:pre-line;overflow-wrap:anywhere}.blacklist-row button{flex:none}
@media(max-width:760px){.page{padding:18px 12px 30px}.head{flex-direction:column}.head-actions{width:100%}.summary{gap:14px;flex-wrap:wrap}.section-head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.form-row{align-items:stretch}.form-row input{flex:1 1 100%;width:100%}.table-wrap{overflow:visible;border:0;background:transparent}.peer-table{display:block;min-width:0}.peer-table thead{display:none}.peer-table tbody{display:grid;gap:8px}.peer-table tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border:1px solid var(--line);background:#fff}.peer-table td{display:block;min-width:0;padding:0;border:0}.peer-table td:first-child,.peer-table td:last-child{grid-column:1/-1}.peer-table td[data-label]::before{display:block;margin-bottom:3px;color:var(--muted);font-size:10px;text-transform:uppercase;content:attr(data-label)}.peer-table .inline-actions{justify-content:flex-end}.peer-table td:first-child::before{content:none}}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div><h1>P2P Fast Peers</h1><div class="subtitle">运行时管理快速区块通知节点</div></div>
    <div class="head-actions">
      <button id="export" type="button" title="导出 peer 列表 JSON">导出 JSON</button>
      <button id="import" type="button" title="导入 peer 列表，保留已连接节点并跳过黑名单节点">导入 JSON</button>
      <button id="refresh" type="button" title="立即刷新状态">刷新</button>
      <input id="file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <div class="summary" aria-live="polite"><span>活跃连接 <strong id="connected">0</strong></span><span>手动节点 <strong id="managed">0</strong></span><span>自动节点 <strong id="auto-count">0</strong></span><span>快速新区块 <strong id="announcements">0</strong></span></div>
  <section class="section" aria-labelledby="auto-title">
    <div class="section-head"><h2 id="auto-title">主网自动 peer 池</h2></div>
    <form class="auto-controls" id="auto-form">
      <label class="auto-toggle"><input id="auto-enabled" type="checkbox"><span>启用自动发现与轮换</span></label>
      <label class="auto-toggle"><input id="auto-ipv6" type="checkbox"><span>允许自动连接 IPv6</span></label>
      <label>自动连接上限<input id="auto-target" type="number" min="1" max="128" step="1" value="30" required></label>
      <label>无快速新区块记录时限（小时）<input id="auto-inactive" type="number" min="1" max="168" step="1" value="24" required></label>
      <button class="primary" id="auto-save" type="submit">应用</button>
    </form>
    <div class="auto-status" id="auto-status" aria-live="polite">正在读取自动 peer 设置…</div>
    <div class="auto-status blacklist-row"><details class="blacklist-details"><summary id="blacklist-summary">永久黑名单 peers</summary><div class="blacklist-peers" id="blacklist-peers"></div></details><button class="danger" id="clear-blacklist" type="button" title="清除永久黑名单中的所有 peer" disabled>清空黑名单</button></div>
  </section>
  <section class="section" aria-labelledby="add-title">
    <div class="section-head"><h2 id="add-title">添加节点</h2></div>
    <form class="form-row" id="add-form">
      <input id="peer-input" name="peer" type="text" maxlength="300" placeholder="例如 node.example.com:8333" autocomplete="off" required>
      <button class="primary" id="add-button" type="submit">添加 Peer</button>
      <span class="hint">支持域名、IPv4 或 [IPv6]:port</span>
    </form>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </section>
  <section class="section" aria-labelledby="peer-title">
    <div class="section-head">
      <h2 id="peer-title">节点状态</h2>
      <div class="toolbar"><label for="sort">排序</label><select id="sort"><option value="ping">TCP 延迟</option><option value="rank">快速记录排名</option><option value="blocks">快速新区块数</option><option value="connected">首次连接时间</option></select></div>
    </div>
    <div class="table-wrap"><table class="peer-table"><thead><tr><th>Peer / 来源</th><th>连接状态</th><th>TCP 延迟</th><th>快速新区块</th><th>排名</th><th>连接信息</th><th>操作</th></tr></thead><tbody id="peers"><tr><td class="empty" colspan="7">正在加载…</td></tr></tbody></table></div>
  </section>
</main>
<script>
'use strict';
var peers=[],busy=false,refreshTimer=null,autoTimer=null,autoDirty=false,autoStatus=null;
function byId(id){return document.getElementById(id)}
function n(value){var x=Number(value);return Number.isFinite(x)?x:0}
function esc(value){var node=document.createElement('span');node.textContent=value==null?'':String(value);return node.innerHTML}
function dateTime(ms){if(!n(ms))return'从未连接';return new Date(n(ms)).toLocaleString()}
function duration(ms){if(!n(ms))return'--';var s=Math.max(0,Math.floor((Date.now()-n(ms))/1000)),d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);return(d?d+'天 ':'')+(h? h+'小时 ':'')+(m?m+'分 ':'')+(s%60)+'秒'}
function showMessage(text,tone){var box=byId('message');box.textContent=text||'';box.className='message'+(tone?' '+tone:'')}
function request(url,options){options=options||{};options.cache='no-store';options.credentials='same-origin';return fetch(url,options).then(function(response){if(!response.ok)return response.json().catch(function(){return{}}).then(function(payload){throw new Error(payload.error||('HTTP '+response.status))});if(response.status===204)return null;return response.json()})}
function statusText(peer){var labels={connecting:'连接中',handshaking:'握手中',connected:'已连接',failed:'连接失败',reconnecting:'重连中'};return labels[peer.state]||peer.state||'未知'}
function stateClass(peer){return'state-'+(peer.state||'unknown')}
function connectedDuration(peer){return peer.connectedSinceMs?'已连接 '+duration(peer.connectedSinceMs):peer.firstConnectedMs?'首次 '+dateTime(peer.firstConnectedMs):'尚未连接成功'}
function render(){var rows=peers.slice(),mode=byId('sort').value;rows.sort(function(a,b){if(mode==='rank')return n(a.fastRank||Number.MAX_SAFE_INTEGER)-n(b.fastRank||Number.MAX_SAFE_INTEGER);if(mode==='blocks')return n(b.fastBlockCount)-n(a.fastBlockCount);if(mode==='connected')return n(a.firstConnectedMs||Number.MAX_SAFE_INTEGER)-n(b.firstConnectedMs||Number.MAX_SAFE_INTEGER);var ap=a.tcpPingMs==null?Number.MAX_SAFE_INTEGER:n(a.tcpPingMs),bp=b.tcpPingMs==null?Number.MAX_SAFE_INTEGER:n(b.tcpPingMs);return ap-bp});var active=rows.filter(function(p){return p.isActive&&p.state==='connected'}).length;byId('connected').textContent=String(active);byId('managed').textContent=String(rows.filter(function(p){return p.isManaged}).length);byId('auto-count').textContent=String(rows.filter(function(p){return p.isAuto}).length);byId('announcements').textContent=String(rows.reduce(function(total,p){return total+n(p.fastBlockCount)},0));if(!rows.length){byId('peers').innerHTML='<tr><td class="empty" colspan="7">没有配置 peer；请添加运行时节点。</td></tr>';return}byId('peers').innerHTML=rows.map(function(peer){var role=peer.isConfigured?'配置节点':peer.isAuto?'自动发现':peer.isManaged?'运行时节点':'节点';var activeText=peer.isActive?'正在运行':'未启用';var ping=peer.tcpPingMs==null?'不可用':Number(peer.tcpPingMs).toFixed(2)+' ms';var pingSub=peer.probeError?'<span class="sub">'+esc(peer.probeError)+'</span>':peer.isAuto&&n(peer.pingSamples)===0?'<span class="sub">最近 TCP 建连耗时</span>':'<span class="sub">'+n(peer.pingSamples)+' 次平均</span>';var state='<span class="state '+stateClass(peer)+'"><i class="dot"></i>'+esc(statusText(peer))+'</span><span class="sub">'+activeText+(peer.reconnectCount?' · 重连 '+peer.reconnectCount+' 次':'')+'</span>';var conn=connectedDuration(peer)+(peer.connectionCount?' · TCP 建连 '+n(peer.connectionCount)+' 次':'');var fastTime=peer.lastFastBlockMs?'<span class="sub">最近 '+esc(dateTime(peer.lastFastBlockMs))+'</span>':'';var actions='<div class="inline-actions">'+(peer.isAuto?'<button type="button" data-pin="'+esc(peer.peer)+'" title="固定为手动运行时节点，不再参与自动轮换">固定</button>':'')+'<button type="button" data-probe="'+esc(peer.peer)+'" title="对该 peer 执行三次 TCP connect 测速">探测</button>'+(peer.isManaged||peer.isAuto?'<button class="danger" type="button" data-remove="'+esc(peer.peer)+'" title="删除并永久拉黑此 peer">删除并拉黑</button>':'')+'</div>';return'<tr><td data-label="Peer / 来源"><span class="peer-address">'+esc(peer.peer)+'</span><span class="sub"><span class="pill">'+role+'</span> '+activeText+'</span></td><td data-label="连接状态">'+state+(peer.lastError?'<span class="sub">'+esc(peer.lastError)+'</span>':'')+'</td><td class="num" data-label="TCP 延迟">'+ping+pingSub+'</td><td class="num" data-label="快速新区块">'+n(peer.fastBlockCount).toLocaleString()+fastTime+'</td><td class="num" data-label="快速排名">'+(peer.fastRank?'#'+peer.fastRank:'--')+'</td><td data-label="连接信息">'+esc(conn)+'</td><td data-label="操作">'+actions+'</td></tr>'}).join('')}
function renderAuto(status){autoStatus=status;if(!status)return;var available=!!status.available;byId('auto-enabled').disabled=!available;byId('auto-ipv6').disabled=!available;byId('auto-target').disabled=!available;byId('auto-inactive').disabled=!available;byId('auto-save').disabled=!available;byId('clear-blacklist').disabled=!n(status.blacklistedPeers);if(!autoDirty){byId('auto-enabled').checked=!!status.settings.enabled;byId('auto-ipv6').checked=!!status.settings.enableIpv6;byId('auto-target').value=String(status.settings.targetPeers);byId('auto-inactive').value=String(status.settings.inactiveHours)}var line=available?'自动节点 '+n(status.activePeers)+' / '+n(status.settings.targetPeers)+'，候选 '+n(status.candidatePeers):'自动发现只支持主网';line+=' · 永久黑名单 '+n(status.blacklistedPeers);if(status.lastDiscoveryMs)line+=' · 最近扫描 '+dateTime(status.lastDiscoveryMs);if(status.lastError)line+=' · '+status.lastError;byId('auto-status').textContent=line;var blacklisted=Array.isArray(status.blacklistedPeerSample)?status.blacklistedPeerSample:[];byId('blacklist-summary').textContent='永久黑名单 peers ('+n(status.blacklistedPeers)+')';byId('blacklist-peers').textContent=blacklisted.length?blacklisted.join('\n'):'暂无'}
function refreshAuto(){request('/api/p2p-fast/auto').then(renderAuto).catch(function(error){byId('auto-status').textContent='自动池状态读取失败：'+error.message}).then(function(){clearTimeout(autoTimer);if(!document.hidden)autoTimer=setTimeout(refreshAuto,15000)})}
function refresh(){if(busy)return;busy=true;byId('refresh').disabled=true;request('/api/p2p-fast/peers').then(function(value){peers=Array.isArray(value)?value:[];render()}).catch(function(error){showMessage('读取 peer 状态失败：'+error.message,'error')}).then(function(){busy=false;byId('refresh').disabled=false;clearTimeout(refreshTimer);if(!document.hidden)refreshTimer=setTimeout(refresh,5000)})}
byId('auto-form').addEventListener('submit',function(event){event.preventDefault();var settings={enabled:byId('auto-enabled').checked,targetPeers:Number(byId('auto-target').value),inactiveHours:Number(byId('auto-inactive').value),enableIpv6:byId('auto-ipv6').checked};byId('auto-save').disabled=true;autoDirty=true;request('/api/p2p-fast/auto',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)}).then(function(status){autoDirty=false;renderAuto(status);showMessage('自动 peer 设置已应用。','ok');return request('/api/p2p-fast/peers')}).then(function(value){peers=value;render()}).catch(function(error){showMessage('自动 peer 设置失败：'+error.message,'error')}).then(function(){byId('auto-save').disabled=false})});
['auto-enabled','auto-ipv6','auto-target','auto-inactive'].forEach(function(id){byId(id).addEventListener('input',function(){autoDirty=true})});
byId('add-form').addEventListener('submit',function(event){event.preventDefault();var peer=byId('peer-input').value.trim();if(!peer)return;byId('add-button').disabled=true;showMessage('正在添加…');request('/api/p2p-fast/peers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({peer:peer})}).then(function(value){peers=value;byId('peer-input').value='';showMessage('Peer 已添加，正在连接。','ok');render()}).catch(function(error){showMessage('添加失败：'+error.message,'error')}).then(function(){byId('add-button').disabled=false})});
byId('peers').addEventListener('click',function(event){var target=event.target.closest('button');if(!target)return;var pin=target.getAttribute('data-pin'),probe=target.getAttribute('data-probe'),remove=target.getAttribute('data-remove');if(pin){target.disabled=true;request('/api/p2p-fast/peers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({peer:pin})}).then(function(value){peers=value;render();showMessage(pin+' 已固定为手动运行时节点。','ok');refreshAuto()}).catch(function(error){showMessage('固定失败：'+error.message,'error')}).then(function(){target.disabled=false});return}if(probe){target.disabled=true;showMessage('正在执行三次 TCP connect 探测…');request('/api/p2p-fast/peers/probe?peer='+encodeURIComponent(probe),{method:'POST'}).then(function(value){showMessage('TCP 平均延迟：'+Number(value.tcp_ping_ms).toFixed(2)+' ms','ok');return request('/api/p2p-fast/peers')}).then(function(value){peers=value;render()}).catch(function(error){showMessage('探测失败：'+error.message,'error')}).then(function(){target.disabled=false});return}if(remove&&window.confirm('删除并断开 '+remove+'，并将其永久加入黑名单？')){target.disabled=true;request('/api/p2p-fast/peers?peer='+encodeURIComponent(remove),{method:'DELETE'}).then(function(value){peers=value;showMessage('Peer 已删除并拉黑。','ok');render();refreshAuto()}).catch(function(error){showMessage('删除失败：'+error.message,'error')})}});
byId('clear-blacklist').addEventListener('click',function(){var button=byId('clear-blacklist');button.disabled=true;request('/api/p2p-fast/auto/blacklist',{method:'DELETE'}).then(function(status){renderAuto(status);showMessage('永久黑名单已清空。','ok');refresh();refreshAuto()}).catch(function(error){showMessage('清空黑名单失败：'+error.message,'error')}).then(function(){button.disabled=!autoStatus||!n(autoStatus.blacklistedPeers)})});
byId('sort').addEventListener('change',render);byId('refresh').addEventListener('click',refresh);
byId('export').addEventListener('click',function(){window.location.href='/api/p2p-fast/peers/export'});
byId('import').addEventListener('click',function(){byId('file').click()});
byId('file').addEventListener('change',function(event){var file=event.target.files&&event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var imported=JSON.parse(String(reader.result));if(!Array.isArray(imported)||imported.some(function(peer){return typeof peer!=='string'}))throw new Error('文件必须是 peer 字符串数组');if(!window.confirm('导入会保留已连接 peer，跳过黑名单 peer，并移除未连接且不在文件中的手动 peer。继续吗？'))return;showMessage('正在校验并导入…');request('/api/p2p-fast/peers/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(imported)}).then(function(value){peers=value;showMessage('导入完成，当前手动 peer '+value.filter(function(p){return p.isManaged}).length+' 个。','ok');render()}).catch(function(error){showMessage('导入失败：'+error.message,'error')})}catch(error){showMessage('无法读取文件：'+error.message,'error')}finally{byId('file').value=''}};reader.onerror=function(){showMessage('文件读取失败。','error');byId('file').value=''};reader.readAsText(file)});
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(refreshTimer);clearTimeout(autoTimer)}else{refresh();refreshAuto()}});refresh();refreshAuto();
</script>
</body>
</html>
